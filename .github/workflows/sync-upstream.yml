# 自动同步上游仓库代码（仅 master 分支）
#
# 触发方式：
#   1. 定时：每 6 小时运行一次，按北京时间从 06:00 开始，
#      即北京时间 06:00 / 12:00 / 18:00 / 00:00（对应 UTC 22:00 / 04:00 / 10:00 / 16:00）
#   2. 手动：Actions -> sync-upstream -> Run workflow
#
# 说明：
#   - 定时任务只在仓库的默认分支上运行，因此本文件必须位于默认分支 master 上才会生效
#   - 上游存在新提交时，优先快进合并；若 fork 的 master 上有独有提交，则创建合并提交
#   - 手动触发时可开启 force，将 master 强制重置为上游的最新状态（会丢弃 fork 上 master 独有的提交）
#   - 若配置了 secrets.UPSTREAM_SYNC_TOKEN（PAT），则使用该令牌推送，可触发下游 workflow；
#     未配置时使用默认的 GITHUB_TOKEN，由它推送的提交不会触发其他 workflow

name: sync-upstream

on:
  schedule:
    # 北京时间 06:00 / 12:00 / 18:00 / 00:00，即 UTC 22:00 / 04:00 / 10:00 / 16:00
    # （GitHub 的 cron 一律按 UTC 解释）
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: "上游仓库（owner/repo），留空使用默认值"
        type: string
        default: "MengMengCode/VoCat"
      branch:
        description: "要同步的分支"
        type: string
        default: "master"
      force:
        description: "强制同步（丢弃 fork 上 master 独有的提交）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 同步任务串行执行，避免并发推送冲突
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ inputs.branch || 'master' }} from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPO: ${{ inputs.upstream || 'MengMengCode/VoCat' }}
      TARGET_BRANCH: ${{ inputs.branch || 'master' }}
      FORCE_SYNC: ${{ inputs.force || 'false' }}
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Sync upstream branch
        shell: bash
        run: |
          set -euo pipefail

          # 在上游仓库本身运行时不做事，避免自己同步自己
          if [ "${GITHUB_REPOSITORY,,}" = "${UPSTREAM_REPO,,}" ]; then
            echo "当前仓库就是上游仓库，无需同步。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          # 显式指定 refspec，确保 upstream/<分支> 这一 remote-tracking 引用被更新
          git fetch --no-tags --prune upstream \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/upstream/${TARGET_BRANCH}"

          UPSTREAM_REF="refs/remotes/upstream/${TARGET_BRANCH}"
          git checkout -B "$TARGET_BRANCH" "origin/${TARGET_BRANCH}"

          PUSH_FLAGS=""
          if [ "$FORCE_SYNC" = "true" ]; then
            echo "强制同步：${TARGET_BRANCH} 将重置为 ${UPSTREAM_REPO}/${TARGET_BRANCH}"
            git reset --hard "$UPSTREAM_REF"
            PUSH_FLAGS="--force-with-lease"
          elif git merge-base --is-ancestor "$UPSTREAM_REF" HEAD; then
            echo "已是最新，无需同步。"
            exit 0
          elif git merge-base --is-ancestor HEAD "$UPSTREAM_REF"; then
            echo "快进合并到上游最新提交。"
            git merge --ff-only "$UPSTREAM_REF"
          else
            echo "fork 存在独有提交，创建合并提交。"
            git merge --no-ff -m "chore: merge upstream ${UPSTREAM_REPO} ${TARGET_BRANCH}" "$UPSTREAM_REF"
          fi

          git push $PUSH_FLAGS origin "HEAD:${TARGET_BRANCH}"
          echo "已同步 ${UPSTREAM_REPO}/${TARGET_BRANCH} -> ${GITHUB_REPOSITORY}:${TARGET_BRANCH} ($(git rev-parse --short HEAD))"
